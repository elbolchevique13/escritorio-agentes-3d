services:
  mundo:
    build: .
    image: mundo-escritorio:local
    container_name: mundo-escritorio
    ports:
      - "127.0.0.1:4747:4747"
    environment:
      OPEN_BROWSER: "0"
      ESCRITORIO_JANELA: "0"
      ESCRITORIO_LOG: "1"
      ESCRITORIO_LOG_FILE: "/app/dados/events.log"
      ESCRITORIO_DADOS: "/app/dados"
      PORT: "4747"
      HOST: "0.0.0.0"
    volumes:
      - mundo-dados:/app/dados
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4747/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mundo-dados:
    name: mundo-dados